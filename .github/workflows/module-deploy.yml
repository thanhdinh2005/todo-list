name: Module - Deploy Homelab

on:
  workflow_call:
    inputs:
      version:
        description: Docker image version (e.g. v1.0.0)
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to Homelab
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          cat <<EOF > ~/.ssh/config
          Host homelab
            HostName $HOST
            User $USER
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            ConnectTimeout 10
          EOF

          chmod 600 ~/.ssh/config

      - name: Deploy Application
        env:
          VERSION: ${{ inputs.version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          ssh homelab <<EOF
            set -e

            APP_PORT=8081
            VERSION="${VERSION}"
            DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME}"

            echo "=================================="
            echo "Deploy Version : \$VERSION"
            echo "Image          : \$DOCKERHUB_USERNAME/spring-api:\$VERSION"
            echo "=================================="

            cd ~/spring-api-deploy/app

            export DOCKERHUB_USERNAME=\$DOCKERHUB_USERNAME
            export APP_VERSION=\$VERSION

            echo "Pull latest image..."
            docker compose pull backend

            echo "Stopping backend..."
            docker compose stop -t 30 backend || true

            echo "Starting backend..."
            docker compose up -d backend

            echo "Waiting for application..."

            for i in {1..30}; do

              if curl -fs http://localhost:\$APP_PORT/api/actuator/health >/dev/null; then
                echo "Application is healthy."
                break
              fi

              if [ \$i -eq 30 ]; then
                echo "Health check failed."

                docker compose logs backend --tail=100

                exit 1
              fi

              sleep 2
            done

            echo "Cleaning unused images..."
            docker image prune -f

            echo ""
            echo "Deployment completed successfully."
          EOF
