spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    show-sql: false

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true

management:
  endpoint:
    health:
      show-details: never

application:
  security:
    jwt:
      secret-key: ${SECRET_KEY}
