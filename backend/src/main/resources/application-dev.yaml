spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:backend}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    show-sql: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: DEBUG

application:
  security:
    jwt:
      secret-key: ${SECRET_KEY:dev-secret-key-dev-secret-key-dev-secret-key}
