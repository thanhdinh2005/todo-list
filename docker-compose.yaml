services:

  adminer:
    image: adminer:5.4.1
    ports:
      - "8083:8080"
    networks:
      - local-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - local-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8081}:8081"
    networks:
      - local-net
    depends_on:
      - postgres
    volumes:
      - /var/log/app:/app/logs

volumes:
  postgres_data:

networks:
  local-net:
    driver: bridge
